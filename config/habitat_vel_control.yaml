# Single-agent velocity control config for HM3D-v2
# This is a separate pipeline from the multi-agent exploration eval.
# habitat_vel_control.py uses continuous velocity commands, not discrete actions.
defaults:
  - /habitat: habitat_config_base
  - /habitat/task: objectnav
  - /habitat/dataset/objectnav: hm3d
  - _self_

habitat_baselines:
  evaluate: True
  force_torch_single_threaded: True

habitat:
  dataset:
    split: val
    data_path: data/datasets/objectnav/hm3d/v2/{split}/{split}.json.gz
  environment:
    max_episode_steps: 5000000  # Long episodes for continuous velocity control
    iterator_options:
      cycle: false
      shuffle: false
      max_scene_repeat_steps: 10000000
  task:
    lab_sensors:
      pointgoal_with_gps_compass_sensor:
        type: PointGoalWithGPSCompassSensor
    measurements:
      success:
        success_distance: 1.0
    actions:
      move_forward:
        type: MoveForwardAction
        tilt_angle: 0
  simulator:
    habitat_sim_v0:
      allow_sliding: true
      enable_physics: true
    forward_step_size: 0.25
    turn_angle: 30
    agents:
      main_agent:
        height: 0.88
        radius: 0.18
        sim_sensors:
          rgb_sensor:
            type: HabitatSimRGBSensor
            width: 640
            height: 480
            hfov: 79
            position: [0, 0.88, 0]
          depth_sensor:
            type: HabitatSimDepthSensor
            width: 640
            height: 480
            hfov: 79
            min_depth: 0.0
            max_depth: 5.0
            normalize_depth: true
            position: [0, 0.88, 0]

detector:
  yolo:
    confidence_threshold_yolo: 0.3
    iou_threshold_yolo: 0.5
    agnostic_nms: True

  groundingDINO:
    confidence_threshold_dino: 0.40
    text_threshold: 0.25

llm:
  use_llm: true
  llm_answer_path: llm/answers/llm_answer_hm3d.txt
  llm_response_path: llm/answers/llm_response_list.txt
  llm_client:
    llm_client: deepseek
    ollama: "qwen3:8b"

record_file_name: "record.txt"
continue_file_name: "continue.txt"
video_output_path: "videos/ablation_hm3dv2_{split}"
test_epi_num: 1
