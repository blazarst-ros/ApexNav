# Multi-agent ObjectNav evaluation config for MP3D
# Composes from Habitat base configs without creating a default main_agent
defaults:
  - /habitat: habitat_config_base
  - /habitat/task: objectnav
  - /habitat/dataset/objectnav: mp3d
  - _self_

habitat_baselines:
  evaluate: True
  force_torch_single_threaded: True

habitat:
  dataset:
    split: val
    data_path: data/datasets/objectnav/mp3d/v1/{split}/{split}.json.gz
  environment:
    max_episode_steps: 500
    iterator_options:
      cycle: false
      shuffle: false
      max_scene_repeat_steps: 10000000
  task:
    lab_sensors:
      pointgoal_with_gps_compass_sensor: {}
    measurements:
      success:
        success_distance: 0.2
  simulator:
    turn_angle: 30
    forward_step_size: 0.25
    habitat_sim_v0:
      gpu_device_id: 0
      allow_sliding: false
    agents_order:
      - agent_0
      - agent_1
    agents:
      agent_0:
        height: 0.88
        radius: 0.18
        sim_sensors:
          rgb_sensor:
            type: HabitatSimRGBSensor
            uuid: agent_0_rgb
            width: 640
            height: 480
            hfov: 79
            position: [0, 0.88, 0]
          depth_sensor:
            type: HabitatSimDepthSensor
            uuid: agent_0_depth
            width: 640
            height: 480
            hfov: 79
            min_depth: 0.0
            max_depth: 5.0
            normalize_depth: true
            position: [0, 0.88, 0]
      agent_1:
        height: 0.88
        radius: 0.18
        sim_sensors:
          rgb_sensor:
            type: HabitatSimRGBSensor
            uuid: agent_1_rgb
            width: 640
            height: 480
            hfov: 79
            position: [0, 0.88, 0]
          depth_sensor:
            type: HabitatSimDepthSensor
            uuid: agent_1_depth
            width: 640
            height: 480
            hfov: 79
            min_depth: 0.0
            max_depth: 5.0
            normalize_depth: true
            position: [0, 0.88, 0]

num_agents: 2

detector:
  yolo:
    confidence_threshold_yolo: 0.3
    iou_threshold_yolo: 0.5
    agnostic_nms: True

  groundingDINO:
    confidence_threshold_dino: 0.40
    text_threshold: 0.25

llm:
  llm_answer_path: llm/answers/llm_answer_mp3d.txt
  llm_response_path: llm/answers/llm_response_list.txt
  llm_client:
    llm_client: deepseek
    ollama: "qwen3:8b"

multiagent:
  episode_termination: cooperative
  inter_agent_avoidance: false
  agent_spawn_offset: 1.0

record_file_name: "record.txt"
continue_file_name: "continue.txt"
need_video: false
video_output_path: "videos/test_mp3d_multiagent_{split}"
test_epi_num: -1
