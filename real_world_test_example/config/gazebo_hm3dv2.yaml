target_label: ""
use_llm: false

detector:
  yoloe:
    confidence_threshold: 0.30
    iou_threshold: 0.50
    agnostic_nms: true

ros:
  rgb_topic: /apexnav/camera/rgb/image_raw
  depth_topic: /apexnav/camera/depth/image_raw
  camera_info_topic: /apexnav/camera/camera_info
  camera_pose_topic: /apexnav/camera/pose
  world_frame: map
  camera_frame: iris_camera_optical_frame
  depth_unit_scale: 1.0
  min_depth: 0.15
  max_depth: 5.0
  object_cloud_stride: 3
  sync_queue: 20
  sync_slop: 0.01
  max_frame_age: 0.50
  legacy_topics: false

vlm:
  yoloe_health_url: http://localhost:12184/healthz
  clipitm_health_url: http://localhost:12182/healthz
  health_timeout: 0.50
  stale_result_sec: 5.0

llm:
  llm_answer_path: llm/answers/llm_answer_hm3d.txt
  llm_response_path: llm/answers/llm_response_list.txt
  llm_client:
    llm_client: offline
